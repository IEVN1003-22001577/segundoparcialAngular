<div class="max-w-3xl mx-auto p-4 bg-blue-900 rounded shadow-lg text-white mt-16">
  
  <!-- LOGOTIPO OFICIAL EN LA PARTE SUPERIOR -->
  <div class="text-center mb-4">
    <img 
      src="https://upload.wikimedia.org/wikipedia/commons/5/53/Cin%C3%A9polis_logo.svg" 
      class="h-20 mx-auto object-contain filter drop-shadow"
      alt="Logo Cinépolis"
    >
  </div>

  <form [formGroup]="formulario">
    
    <!-- CONTENEDOR PRINCIPAL -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mb-3">
      
      <!-- ENTRADAS -->
      <div class="md:col-span-8 border border-blue-400 p-3 rounded">
        <span class="text-sm font-semibold italic px-1 block mb-2 border-b border-blue-400 pb-1">Entradas</span>
        
        <!-- Nombre -->
        <div class="flex items-center mb-2.5">
          <label class="w-40 text-xs font-medium">Nombre</label>
          <input 
            type="text" 
            formControlName="nombre" 
            class="flex-1 bg-white border border-gray-400 text-gray-900 text-xs rounded p-1"
          >
        </div>

        <!-- Cantidad Compradores -->
        <div class="flex items-center mb-2.5">
          <label class="w-40 text-xs font-medium">Cantidad Compradores</label>
          <input 
            type="number" 
            formControlName="cantidadCompradores" 
            class="flex-1 bg-white border border-gray-400 text-gray-900 text-xs rounded p-1"
          >
        </div>

        <!-- Tarjeta Cineco -->
        <div class="flex items-center mb-2.5">
          <label class="w-40 text-xs font-medium">Tarjeta Cineco</label>
          <div class="flex items-center space-x-4 text-xs">
            <label class="flex items-center cursor-pointer">
              <input type="radio" value="si" formControlName="tarjetaCineco" class="mr-1"> Si
            </label>
            <label class="flex items-center cursor-pointer">
              <input type="radio" value="no" formControlName="tarjetaCineco" class="mr-1"> No
            </label>
          </div>
        </div>

        <!-- Cantidad De Boletas -->
        <div class="flex items-center mb-1">
          <label class="w-40 text-xs font-medium">Cantidad De Boletas</label>
          <input 
            type="number" 
            formControlName="cantidadBoletas" 
            max="7" 
            min="1" 
            class="flex-1 bg-white border border-gray-400 text-gray-900 text-xs rounded p-1" 
            placeholder="Máx. 7"
          >
        </div>
      </div>

      <!-- SALIDAS -->
      <div class="md:col-span-4 border border-blue-400 p-3 rounded flex flex-col">
        <span class="text-sm font-semibold italic px-1 block mb-2 border-b border-blue-400 pb-1">Salidas</span>
        <div class="mb-2">
          <label class="block text-xs font-medium mb-1">Valor a Pagar</label>
          <input 
            type="text" 
            [value]="resultadoCompra.valorAPagar > 0 ? ('$' + resultadoCompra.valorAPagar.toLocaleString()) : ''" 
            readonly 
            class="bg-gray-100 border border-gray-400 text-gray-900 text-xs rounded w-full p-1 font-bold"
          >
        </div>
      </div>

    </div>

    <!-- ACCIONES -->
    <div class="border border-blue-400 p-2.5 rounded max-w-xs mx-auto text-center mb-3">
      <span class="text-xs font-semibold italic block mb-2">Acciones</span>
      <div class="flex justify-center gap-3">
        <button 
          type="button" 
          (click)="procesarCompra()" 
          class="bg-white text-blue-900 border border-gray-400 font-medium rounded text-xs px-5 py-1 shadow hover:bg-gray-100"
        >
          Procesar
        </button>
        <button 
          type="button" 
          (click)="limpiarFormulario()" 
          class="bg-gray-200 text-red-700 border border-gray-400 font-medium rounded text-xs px-5 py-1 shadow hover:bg-gray-300"
        >
          Salir
        </button>
      </div>
    </div>

    <!-- MENSAJE DE ERROR -->
    <div *ngIf="errorMessage" class="max-w-md mx-auto bg-red-700 border border-red-400 text-white text-xs px-4 py-2 rounded text-center font-bold shadow">
      {{ errorMessage }}
    </div>

  </form>

</div>
